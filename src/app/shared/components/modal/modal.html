@if (open) {
  <div class="backdrop" (click)="close()">
    <div class="panel" role="dialog" aria-modal="true" [attr.aria-label]="title" (click)="$event.stopPropagation()">
      <header>
        <h2>{{ title }}</h2>
        <button type="button" class="btn btn-icon" (click)="close()" aria-label="Close"><app-icon name="x" /></button>
      </header>
      <div class="body">
        <ng-content />
      </div>
    </div>
  </div>
}
